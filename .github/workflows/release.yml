name: Release & Publish Blog

on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ragehardrack/dan-website-nuxt3

jobs:
  test:
    name: Test Blog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (v1.4)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build application
        run: bun run build

  release:
    name: Build & Push Image, Publish Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and notes from the CHANGELOG
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          PR_BODY="${RUNNER_TEMP}/pr-body.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].body // ""' > "$PR_BODY"

          NOTES="${RUNNER_TEMP}/notes.md"
          VERSION=$(bash .github/scripts/release-notes.sh CHANGELOG.md "$PR_BODY" "$NOTES")
          NEW_TAG="v${VERSION}"
          echo "Release tag: $NEW_TAG"

          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "::error::Tag ${NEW_TAG} already exists. CHANGELOG.md has no new version: add one in the release PR."
            exit 1
          fi

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.notes.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The GitHub release event is what triggers the Discord changelog, so it
      # is published only once the image is on GHCR.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes }}" \
            --target "${GITHUB_SHA}"
